# Fun facts about numbers
# These are displayed when the bug/chore count matches the number

0: "Zero bugs! Time to celebrate! :tada:"
1: "Just one! The loneliest number."
2: "Two bugs sitting in a tree..."
3: "Three is a magic number!"
4: "Four corners of the bug world."
5: "High five! ...wait, that's not good."
6: "Six bugs, six legs each... that's 36 legs of bugs!"
7: "Seven lucky bugs? Not so lucky for us."
8: "Eight bugs, like an octopus of issues."
9: "Nine bugs... almost to double digits!"
10: "Double digits! We're in the big leagues now."
11: "Eleven bugs... make a wish at 11:11!"
12: "A dozen bugs, like a dozen donuts but less tasty."
13: "Unlucky 13... or is it?"
15: "15 bugs... that's a lot of coffee needed."
20: "20 bugs! A score of issues."
21: "Blackjack! But we're not winning."
42: "The answer to life, the universe, and everything... is bugs?"
50: "Half a century of bugs!"
69: "Nice... wait, no, that's not nice at all."
100: "A century of bugs! Time for a cricket match."
