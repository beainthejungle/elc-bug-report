name: Daily Bug Report

on:
  schedule:
    # 7:00 UTC = 9:00 Europe/Madrid (CET), Mondays only
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Generate config from secret
        run: |
          mkdir -p config
          echo "$CONFIG_YML" > config/config.yml
        env:
          CONFIG_YML: ${{ secrets.CONFIG_YML }}

      - name: Run ELC bug report
        run: bundle exec ./bin/elc_bug_report
